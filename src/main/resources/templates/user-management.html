<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>User Management - Reports Server</title>
    <link rel="stylesheet" href="/css/index.css">
    <style>
        .container {
            padding-top: 24px;
            padding-bottom: 24px;
        }
        .users-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .users-table th,
        .users-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        .users-table th {
            background: #f8f9ff;
            color: #667eea;
            font-weight: 600;
        }
        .users-table tr:hover {
            background: #f8f9ff;
        }
        .btn-small {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 5px;
        }
        .btn-small:hover {
            background: #764ba2;
        }
        .btn-danger {
            background: #dc3545;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-admin {
            background: #667eea;
            color: white;
        }
        .badge-user {
            background: #e0e0e0;
            color: #666;
        }
        .badge-operator {
            background: #17a2b8;
            color: white;
        }
        .badge-read-only {
            background: #6c757d;
            color: white;
        }
        .badge-enabled {
            background: #28a745;
            color: white;
        }
        .badge-disabled {
            background: #dc3545;
            color: white;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1200;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }
        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .modal-header {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        .modal-header h3 {
            color: #667eea;
        }
        .close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            color: #999;
            cursor: pointer;
        }
        .close:hover {
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input[type="text"], input[type="email"], input[type="password"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        #message {
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            margin: 15px 0;
        }
        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
        }
        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }
            .card {
                padding: 20px;
            }
            .users-table {
                font-size: 13px;
            }
            .users-table th,
            .users-table td {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <th:block th:replace="~{fragments/index-sidebar :: sidebar}"></th:block>

    <!-- Main Content -->
    <div class="container">
        
        <!-- Current User Info -->
        <div class="card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; margin-bottom: 20px;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <span style="font-size: 48px;">👤</span>
                <div>
                    <h3 style="color: white; margin: 0 0 5px 0; border: none; padding: 0;">Logged in as</h3>
                    <p id="currentUserUsername" style="font-size: 20px; font-weight: 600; margin: 0;" sec:authentication="name">User</p>
                    <p id="currentUserRole" style="font-size: 14px; opacity: 0.9; margin: 5px 0 0 0;">Role</p>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2>🔐 Manage Users</h2>
            <button class="btn" onclick="openUserModal()">➕ Add New User</button>
            <table class="users-table" id="usersTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Created At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr>
                        <td colspan="7" style="text-align: center; color: #999;">Loading users...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- User Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close" onclick="closeUserModal()">&times;</span>
                <h3 id="modalTitle">Add User</h3>
            </div>
            <form id="userForm">
                <input type="hidden" id="userId">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group" id="passwordGroup">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="role">Role:</label>
                    <select id="role" name="role" required>
                        <option value="READ_ONLY">Read Only</option>
                        <option value="OPERATOR">Operator</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="enabled" name="enabled" checked>
                    <label for="enabled">Enabled</label>
                </div>
                <button type="submit" class="btn">Save</button>
                <button type="button" id="resetPasswordBtn" class="btn" style="background: #dc3545; display: none; margin-left: 10px;" onclick="openResetPasswordModal()">🔐 Reset Password</button>
                <div id="userMessage" style="margin-top: 15px;"></div>
            </form>
        </div>
    </div>

    <!-- Reset Password Modal -->
    <div id="resetPasswordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close" onclick="closeResetPasswordModal()">&times;</span>
                <h3>Reset Password for <span id="resetPasswordUsername"></span></h3>
            </div>
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPasswordField">New Password:</label>
                    <input type="password" id="newPasswordField" name="newPassword" required placeholder="Enter new password (min 8 characters)">
                </div>
                <div class="form-group">
                    <label for="confirmPasswordField">Confirm Password:</label>
                    <input type="password" id="confirmPasswordField" name="confirmPassword" required placeholder="Confirm new password">
                </div>
                <div style="background: #f0f0f0; padding: 10px; border-radius: 6px; margin: 15px 0; font-size: 13px; color: #555;">
                    <strong>Note:</strong> The user will be required to set a new password on their next login.
                </div>
                <button type="submit" class="btn">Reset Password</button>
                <button type="button" class="btn" style="background: #6c757d; margin-left: 10px;" onclick="closeResetPasswordModal()">Cancel</button>
                <div id="resetPasswordMessage" style="margin-top: 15px;"></div>
            </form>
        </div>
    </div>

    <script>
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');
        let currentResetUserId = null;

        document.addEventListener('DOMContentLoaded', () => {
            bindSidebarNavigation();
            bindForms();
            fetchCurrentUserDisplay();
            clearSidebarActiveNav();
            loadUsers();
        });

        function formatRoleLabel(roleValue) {
            if (!roleValue) return 'Unknown Role';
            const normalized = String(roleValue).replace(/^ROLE_/, '');
            const labels = {
                ADMIN: 'Admin',
                OPERATOR: 'Operator',
                READ_ONLY: 'Read Only'
            };
            return labels[normalized] || normalized.replace(/_/g, ' ');
        }

        function fetchCurrentUserDisplay() {
            fetch('/api/current-user')
                .then(response => response.json())
                .then(data => {
                    if (!data || data.status !== 'success') {
                        return;
                    }

                    const username = data.username || 'User';
                    const role = data.role || 'READ_ONLY';

                    const sidebarUsername = document.getElementById('sidebarCurrentUsername');
                    if (sidebarUsername) {
                        sidebarUsername.textContent = username;
                    }

                    const headerUsername = document.getElementById('currentUserUsername');
                    if (headerUsername) {
                        headerUsername.textContent = username;
                    }

                    const headerRole = document.getElementById('currentUserRole');
                    if (headerRole) {
                        headerRole.textContent = formatRoleLabel(role);
                    }
                })
                .catch(error => {
                    console.error('Error loading current user display:', error);
                });
        }

        function getHeadersWithCsrf(additionalHeaders = {}) {
            const headers = { ...additionalHeaders };
            if (csrfToken && csrfHeader) {
                headers[csrfHeader] = csrfToken;
            }
            return headers;
        }

        function bindSidebarNavigation() {
            document.querySelectorAll('.nav-item[data-tab]').forEach((navItem) => {
                navItem.addEventListener('click', () => {
                    const tabName = navItem.getAttribute('data-tab');
                    if (tabName) {
                        switchTab(tabName);
                    }
                });
            });
        }

        function bindForms() {
            const userForm = document.getElementById('userForm');
            if (userForm) {
                userForm.addEventListener('submit', handleUserFormSubmit);
            }

            const resetPasswordForm = document.getElementById('resetPasswordForm');
            if (resetPasswordForm) {
                resetPasswordForm.addEventListener('submit', handleResetPasswordFormSubmit);
            }
        }

        function clearSidebarActiveNav() {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        }

        function switchTab(tabName) {
            closeSidebarUserMenu();
            if (tabName === 'users') {
                return;
            }
            window.location.href = '/?tab=' + encodeURIComponent(tabName);
        }

        function toggleSidebarTreeSection(sectionName) {
            const group = document.querySelector(`.sidebar-tree-group[data-sidebar-section="${sectionName}"]`);
            if (!group) return;

            group.classList.toggle('expanded');
            const toggle = group.querySelector('.sidebar-tree-group-toggle');
            if (toggle) {
                toggle.setAttribute('aria-expanded', group.classList.contains('expanded') ? 'true' : 'false');
            }
        }

        function toggleSidebarUserMenu() {
            const menu = document.getElementById('sidebarSettingsMenu');
            const toggle = document.getElementById('sidebarSettingsToggle');
            const chip = document.getElementById('sidebarUserChip');
            if (!menu) return;

            const willOpen = !menu.classList.contains('open');
            menu.classList.toggle('open', willOpen);
            if (toggle) {
                toggle.classList.toggle('active', willOpen);
                toggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
            }
            if (chip) {
                chip.classList.toggle('active', willOpen);
                chip.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
            }
        }

        function closeSidebarUserMenu() {
            const menu = document.getElementById('sidebarSettingsMenu');
            const toggle = document.getElementById('sidebarSettingsToggle');
            const chip = document.getElementById('sidebarUserChip');
            if (!menu) return;

            menu.classList.remove('open');
            if (toggle) {
                toggle.classList.remove('active');
                toggle.setAttribute('aria-expanded', 'false');
            }
            if (chip) {
                chip.classList.remove('active');
                chip.setAttribute('aria-expanded', 'false');
            }
        }

        function submitSidebarLogout() {
            const form = document.getElementById('sidebarLogoutForm');
            if (form) {
                form.submit();
            }
        }

        function loadUsers() {
            fetch('/api/users?page=0&size=100')
                .then(response => response.json())
                .then(payload => {
                    const users = Array.isArray(payload) ? payload : (payload.content || []);
                    const tableBody = document.getElementById('usersTableBody');
                    if (!tableBody) return;

                    tableBody.innerHTML = '';

                    if (users.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #999;">No users found</td></tr>';
                        return;
                    }

                    users.forEach(user => {
                        const row = document.createElement('tr');

                        const idCell = document.createElement('td');
                        idCell.textContent = user.id;

                        const usernameCell = document.createElement('td');
                        usernameCell.textContent = user.username;

                        const emailCell = document.createElement('td');
                        emailCell.textContent = user.email;

                        const roleCell = document.createElement('td');
                        const roleBadge = document.createElement('span');
                        if (user.role === 'ADMIN') {
                            roleBadge.className = 'badge badge-admin';
                        } else if (user.role === 'OPERATOR') {
                            roleBadge.className = 'badge badge-operator';
                        } else {
                            roleBadge.className = 'badge badge-read-only';
                        }
                        roleBadge.textContent = user.role;
                        roleCell.appendChild(roleBadge);

                        const statusCell = document.createElement('td');
                        const statusBadge = document.createElement('span');
                        statusBadge.className = user.enabled ? 'badge badge-enabled' : 'badge badge-disabled';
                        statusBadge.textContent = user.enabled ? 'Enabled' : 'Disabled';
                        statusCell.appendChild(statusBadge);

                        const createdCell = document.createElement('td');
                        createdCell.textContent = new Date(user.createdAt).toLocaleDateString();

                        const actionsCell = document.createElement('td');
                        const editBtn = document.createElement('button');
                        editBtn.className = 'btn-small';
                        editBtn.textContent = 'Edit';
                        editBtn.onclick = () => editUser(user.id);

                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'btn-small btn-danger';
                        deleteBtn.textContent = 'Delete';
                        deleteBtn.onclick = () => deleteUser(user.id);

                        actionsCell.appendChild(editBtn);
                        actionsCell.appendChild(deleteBtn);

                        row.appendChild(idCell);
                        row.appendChild(usernameCell);
                        row.appendChild(emailCell);
                        row.appendChild(roleCell);
                        row.appendChild(statusCell);
                        row.appendChild(createdCell);
                        row.appendChild(actionsCell);

                        tableBody.appendChild(row);
                    });
                })
                .catch(error => {
                    console.error('Error loading users:', error);
                });
        }

        function openUserModal(userId = null) {
            const modal = document.getElementById('userModal');
            const form = document.getElementById('userForm');
            const title = document.getElementById('modalTitle');
            const passwordGroup = document.getElementById('passwordGroup');
            const resetPasswordBtn = document.getElementById('resetPasswordBtn');

            if (!modal || !form || !title || !passwordGroup || !resetPasswordBtn) {
                return;
            }

            form.reset();
            document.getElementById('userMessage').innerHTML = '';
            document.getElementById('enabled').checked = true;

            if (userId) {
                title.textContent = 'Edit User';
                passwordGroup.style.display = 'none';
                resetPasswordBtn.style.display = 'inline-block';

                fetch('/api/users/' + userId)
                    .then(response => response.json())
                    .then(user => {
                        document.getElementById('userId').value = user.id;
                        document.getElementById('username').value = user.username;
                        document.getElementById('username').readOnly = true;
                        document.getElementById('email').value = user.email;
                        document.getElementById('role').value = user.role;
                        document.getElementById('enabled').checked = user.enabled;
                    });
            } else {
                title.textContent = 'Add User';
                document.getElementById('userId').value = '';
                document.getElementById('username').readOnly = false;
                passwordGroup.style.display = 'block';
                resetPasswordBtn.style.display = 'none';
            }

            modal.style.display = 'block';
        }

        function closeUserModal() {
            const modal = document.getElementById('userModal');
            if (modal) {
                modal.style.display = 'none';
            }
        }

        function openResetPasswordModal() {
            const userId = document.getElementById('userId').value;
            const username = document.getElementById('username').value;

            if (!userId) {
                alert('Please save the user first before resetting password');
                return;
            }

            currentResetUserId = userId;
            document.getElementById('resetPasswordUsername').textContent = username;
            document.getElementById('resetPasswordForm').reset();
            document.getElementById('resetPasswordMessage').innerHTML = '';
            document.getElementById('resetPasswordModal').style.display = 'block';
        }

        function closeResetPasswordModal() {
            const modal = document.getElementById('resetPasswordModal');
            if (modal) {
                modal.style.display = 'none';
            }
            currentResetUserId = null;
        }

        function editUser(id) {
            openUserModal(id);
        }

        function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this user?')) return;

            fetch('/api/users/' + id, {
                method: 'DELETE',
                headers: getHeadersWithCsrf()
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        alert(data.message);
                        loadUsers();
                    } else {
                        alert(data.message);
                    }
                })
                .catch(error => {
                    alert('Failed to delete user: ' + error);
                });
        }

        function handleUserFormSubmit(e) {
            e.preventDefault();

            const id = document.getElementById('userId').value;
            const formData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                role: document.getElementById('role').value,
                enabled: document.getElementById('enabled').checked
            };

            if (!id) {
                formData.password = document.getElementById('password').value;
            }

            const url = id ? '/api/users/' + id : '/api/users';
            const method = id ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: getHeadersWithCsrf({
                    'Content-Type': 'application/json'
                }),
                body: JSON.stringify(formData)
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        showUserMessage(data.message, 'success');
                        setTimeout(() => {
                            closeUserModal();
                            loadUsers();
                        }, 1500);
                    } else {
                        showUserMessage(data.message, 'error');
                    }
                })
                .catch(error => {
                    showUserMessage('Failed to save user: ' + error, 'error');
                });
        }

        function handleResetPasswordFormSubmit(e) {
            e.preventDefault();

            const newPassword = document.getElementById('newPasswordField').value;
            const confirmPassword = document.getElementById('confirmPasswordField').value;

            if (newPassword.length < 8) {
                showResetPasswordMessage('Password must be at least 8 characters long', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showResetPasswordMessage('Passwords do not match', 'error');
                return;
            }

            if (!currentResetUserId) {
                showResetPasswordMessage('User ID not found', 'error');
                return;
            }

            fetch('/api/users/' + currentResetUserId + '/reset-password', {
                method: 'POST',
                headers: getHeadersWithCsrf({
                    'Content-Type': 'application/json'
                }),
                body: JSON.stringify({ newPassword: newPassword })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        showResetPasswordMessage(data.message, 'success');
                        setTimeout(() => {
                            closeResetPasswordModal();
                            closeUserModal();
                            loadUsers();
                        }, 1500);
                    } else {
                        showResetPasswordMessage(data.message, 'error');
                    }
                })
                .catch(error => {
                    showResetPasswordMessage('Failed to reset password: ' + error, 'error');
                });
        }

        function showUserMessage(text, type) {
            const msg = document.getElementById('userMessage');
            if (!msg) return;
            msg.textContent = text;
            msg.className = type;
            msg.style.display = 'block';
        }

        function showResetPasswordMessage(text, type) {
            const msg = document.getElementById('resetPasswordMessage');
            if (!msg) return;
            msg.textContent = text;
            msg.className = type;
            msg.style.display = 'block';
        }

        window.addEventListener('click', function(event) {
            const modal = document.getElementById('userModal');
            if (event.target === modal) {
                closeUserModal();
            }

            const resetPasswordModal = document.getElementById('resetPasswordModal');
            if (event.target === resetPasswordModal) {
                closeResetPasswordModal();
            }

            const sidebarMenu = document.getElementById('sidebarSettingsMenu');
            const sidebarToggle = document.getElementById('sidebarSettingsToggle');
            const sidebarChip = document.getElementById('sidebarUserChip');
            if (sidebarMenu) {
                const clickedInsideMenu = sidebarMenu.contains(event.target);
                const clickedToggle = sidebarToggle && (event.target === sidebarToggle || sidebarToggle.contains(event.target));
                const clickedChip = sidebarChip && (event.target === sidebarChip || sidebarChip.contains(event.target));
                if (!clickedInsideMenu && !clickedToggle && !clickedChip) {
                    closeSidebarUserMenu();
                }
            }
        });
    </script>
</body>
</html>
