<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bwignore="true" data-1p-ignore="true" data-lpignore="true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:text="#{changePassword.title}">Change Password - Reports Server</title>
    <script>
        (function () {
            function shouldIgnore(text, source) {
                return text.indexOf('No Listener: tabs:outgoing.message.ready') !== -1 ||
                    source.indexOf('bootstrap-autofill-overlay.js') !== -1 ||
                    text.indexOf("Cannot read properties of null (reading 'includes')") !== -1;
            }
            window.addEventListener('unhandledrejection', function (event) {
                var reason = event && event.reason;
                var text = String((reason && (reason.message || reason.stack)) || reason || '');
                if (shouldIgnore(text, text)) {
                    event.preventDefault();
                }
            }, true);
            window.addEventListener('error', function (event) {
                var text = String((event && event.message) || '');
                var source = String((event && event.filename) || '');
                if (shouldIgnore(text, source)) {
                    event.preventDefault();
                    return true;
                }
                return false;
            }, true);
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
        }
        .warning {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #ffeeba;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
            width: 100%;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        #message {
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        .two-factor-panel {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #e8e8e8;
        }
        .two-factor-note {
            font-size: 13px;
            color: #666;
            margin: 6px 0 12px;
        }
        .two-factor-qr {
            width: 220px;
            height: 220px;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: none;
            margin: 0 auto 12px;
        }
        .two-factor-status {
            margin-top: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        .two-factor-status.enabled {
            color: #155724;
        }
        .two-factor-status.pending {
            color: #856404;
        }
        .two-factor-status.disabled {
            color: #6c757d;
        }
        .two-factor-inline {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 8px;
        }
        .two-factor-inline input {
            flex: 1;
        }
        .btn-secondary {
            background: #6c757d;
            width: auto;
            padding: 12px 16px;
        }
    </style>
</head>
<body data-bwignore="true" data-1p-ignore="true" data-lpignore="true">
    <div class="container">
        <h1>🔐 <span th:text="#{changePassword.heading}">Change Password</span></h1>
        
        <div th:if="${firstLogin}" class="warning">
            <strong>⚠️ <span th:text="#{changePassword.firstLogin.title}">First Login Detected</span></strong>
            <p th:text="#{changePassword.firstLogin.message}">You must change your password before continuing.</p>
        </div>
        
        <form id="changePasswordForm">
            <div class="form-group">
                <label for="oldPassword" th:text="#{changePassword.currentPassword}">Current Password:</label>
                <input type="password" id="oldPassword" name="oldPassword" required>
            </div>
            
            <div class="form-group">
                <label for="newPassword" th:text="#{changePassword.newPassword}">New Password:</label>
                <input type="password" id="newPassword" name="newPassword" required minlength="6">
            </div>
            
            <div class="form-group">
                <label for="confirmPassword" th:text="#{changePassword.confirmPassword}">Confirm New Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
            </div>
            
            <button type="submit" class="btn" th:text="#{changePassword.submit}">Change Password</button>
            
            <div id="message"></div>
        </form>

        <div id="twoFactorPanel" class="two-factor-panel" style="display: none;">
            <h2 style="font-size: 20px; color: #667eea; margin-bottom: 8px;" th:text="#{changePassword.twoFactor.heading}">Two-Factor Authentication</h2>
            <p id="twoFactorStatus" class="two-factor-status disabled" th:text="#{changePassword.twoFactor.status.disabled}">2FA disabled</p>
            <p class="two-factor-note" th:text="#{changePassword.twoFactor.note}">If 2FA is enabled by an admin, scan the QR code below with your authenticator app and verify one code.</p>

            <img id="twoFactorQr" class="two-factor-qr" alt="2FA QR code">

            <div class="form-group">
                <label for="twoFactorSecret" th:text="#{changePassword.twoFactor.manualKey}">Manual Key:</label>
                <input type="text" id="twoFactorSecret" readonly>
            </div>

            <div class="form-group">
                <label for="twoFactorCode" th:text="#{changePassword.twoFactor.code}">Verification Code:</label>
                <div class="two-factor-inline">
                    <input type="text" id="twoFactorCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" th:placeholder="#{changePassword.twoFactor.code.placeholder}" placeholder="6-digit code">
                    <button id="verifyTwoFactorBtn" type="button" class="btn btn-secondary" th:text="#{changePassword.twoFactor.verify}">Verify 2FA</button>
                </div>
            </div>
            <div id="twoFactorMessage"></div>
        </div>
        
        <div class="back-link" th:unless="${firstLogin}">
            <a th:href="@{/}" th:text="#{changePassword.back}">← Back to Dashboard</a>
        </div>
    </div>

    <script th:inline="javascript">
        const I18N_CP = {
            passwordMismatch: /*[[#{changePassword.msg.passwordMismatch}]]*/ 'New passwords do not match',
            passwordMinLength: /*[[#{changePassword.msg.passwordMinLength}]]*/ 'Password must be at least 6 characters long',
            csrfInvalid: /*[[#{changePassword.msg.csrfInvalid}]]*/ 'Your session or CSRF token is no longer valid. Refresh and try again.',
            unexpectedServerResponse: /*[[#{changePassword.msg.unexpectedServerResponse}]]*/ 'Unexpected server response',
            failedToChange: /*[[#{changePassword.msg.failedToChange}]]*/ 'Failed to change password',
            statusEnabledVerified: /*[[#{changePassword.twoFactor.status.enabledVerified}]]*/ '2FA enabled and verified',
            statusEnabledPending: /*[[#{changePassword.twoFactor.status.enabledPending}]]*/ '2FA enabled - verification pending',
            statusDisabledAdmin: /*[[#{changePassword.twoFactor.status.disabledAdmin}]]*/ '2FA disabled (admin must enable it first)',
            enterValidCode: /*[[#{changePassword.twoFactor.msg.enterValidCode}]]*/ 'Please enter a valid 6-digit code.',
            verified: /*[[#{changePassword.twoFactor.msg.verified}]]*/ '2FA verified.',
            invalidCode: /*[[#{changePassword.twoFactor.msg.invalidCode}]]*/ 'Invalid code.',
            failedVerify: /*[[#{changePassword.twoFactor.msg.failedVerify}]]*/ 'Failed to verify 2FA'
        };

        document.getElementById('changePasswordForm').onsubmit = function(e) {
            e.preventDefault();
            
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                showMessage(I18N_CP.passwordMismatch, 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showMessage(I18N_CP.passwordMinLength, 'error');
                return;
            }
            
            const csrfTokenMeta = document.querySelector('meta[name="_csrf"]');
            const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');

            const headers = {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            };

            if (csrfTokenMeta && csrfHeaderMeta) {
                headers[csrfHeaderMeta.content] = csrfTokenMeta.content;
            }

            fetch('/api/change-password', {
                method: 'POST',
                credentials: 'same-origin',
                headers: headers,
                body: JSON.stringify({
                    oldPassword: oldPassword,
                    newPassword: newPassword
                })
            })
            .then(async response => {
                const contentType = response.headers.get('content-type') || '';

                if (!contentType.includes('application/json')) {
                    await response.text();
                    if (response.status === 401 || response.status === 403 || response.redirected) {
                        throw new Error(I18N_CP.csrfInvalid);
                    }
                    throw new Error(`${I18N_CP.unexpectedServerResponse} (${response.status}).`);
                }

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || `${I18N_CP.failedToChange} (${response.status}).`);
                }

                return data;
            })
            .then(data => {
                if (data.status === 'success') {
                    showMessage(data.message, 'success');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    showMessage(data.message, 'error');
                }
            })
            .catch(error => {
                showMessage(I18N_CP.failedToChange + ': ' + error.message, 'error');
            });
        };

        function getCsrfHeaders(additionalHeaders = {}) {
            const csrfTokenMeta = document.querySelector('meta[name="_csrf"]');
            const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
            const headers = { ...additionalHeaders };
            if (csrfTokenMeta && csrfHeaderMeta) {
                headers[csrfHeaderMeta.content] = csrfTokenMeta.content;
            }
            return headers;
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = type;
            msg.style.display = 'block';
        }

        function showTwoFactorMessage(text, type) {
            const msg = document.getElementById('twoFactorMessage');
            msg.textContent = text;
            msg.className = type;
            msg.style.display = 'block';
            msg.style.marginTop = '10px';
            msg.style.padding = '10px';
            msg.style.borderRadius = '6px';
        }

        function loadTwoFactorSetup() {
            fetch('/api/users/me/2fa/setup', {
                method: 'GET',
                credentials: 'same-origin',
                headers: getCsrfHeaders({ 'Accept': 'application/json' })
            })
                .then(response => response.json())
                .then(data => {
                    if (!data || data.status !== 'success') {
                        return;
                    }

                    const panel = document.getElementById('twoFactorPanel');
                    if (!panel) {
                        return;
                    }
                    panel.style.display = 'block';

                    const setup = data.setup || {};
                    const status = document.getElementById('twoFactorStatus');
                    const qr = document.getElementById('twoFactorQr');
                    const secret = document.getElementById('twoFactorSecret');

                    if (setup.enabled && setup.confirmed) {
                        status.textContent = I18N_CP.statusEnabledVerified;
                        status.className = 'two-factor-status enabled';
                    } else if (setup.enabled) {
                        status.textContent = I18N_CP.statusEnabledPending;
                        status.className = 'two-factor-status pending';
                    } else {
                        status.textContent = I18N_CP.statusDisabledAdmin;
                        status.className = 'two-factor-status disabled';
                    }

                    if (setup.enabled && setup.qrCodeDataUri) {
                        qr.src = setup.qrCodeDataUri;
                        qr.style.display = 'block';
                    } else {
                        qr.style.display = 'none';
                    }

                    secret.value = setup.secret || '';
                })
                .catch(error => {
                    console.error('Failed to load 2FA setup:', error);
                });
        }

        function verifyTwoFactor() {
            const code = (document.getElementById('twoFactorCode')?.value || '').trim();
            if (!/^\d{6}$/.test(code)) {
                showTwoFactorMessage(I18N_CP.enterValidCode, 'error');
                return;
            }

            fetch('/api/users/me/2fa/verify', {
                method: 'POST',
                credentials: 'same-origin',
                headers: getCsrfHeaders({
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                }),
                body: JSON.stringify({ code: code })
            })
                .then(response => response.json())
                .then(data => {
                    if (data && data.status === 'success') {
                        showTwoFactorMessage(data.message || I18N_CP.verified, 'success');
                        document.getElementById('twoFactorCode').value = '';
                        loadTwoFactorSetup();
                    } else {
                        showTwoFactorMessage((data && data.message) || I18N_CP.invalidCode, 'error');
                    }
                })
                .catch(error => {
                    showTwoFactorMessage(I18N_CP.failedVerify + ': ' + error.message, 'error');
                });
        }

        document.getElementById('verifyTwoFactorBtn')?.addEventListener('click', verifyTwoFactor);
        document.addEventListener('DOMContentLoaded', loadTwoFactorSetup);
    </script>
</body>
</html>
