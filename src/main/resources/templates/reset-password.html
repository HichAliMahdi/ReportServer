<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{auth.reset.title}">Reset Password - Reports Server</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .reset-container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .links {
            margin-top: 20px;
            text-align: center;
        }
        .links a {
            color: #667eea;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .password-hint {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        .language-picker {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 13px;
        }
        .language-picker select {
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.18);
            color: white;
            padding: 6px 8px;
            backdrop-filter: blur(4px);
        }
        .language-picker option {
            color: #1f2937;
        }
    </style>
</head>
<body>
    <form class="language-picker" th:action="@{/reset-password}" method="get">
        <input type="hidden" name="token" th:value="${token}" th:if="${token}">
        <label for="langSelectReset" th:text="#{lang.label}">Language</label>
        <select id="langSelectReset" name="lang" onchange="this.form.submit()">
            <option value="en" th:selected="${#locale.language == 'en'}" th:text="#{lang.en}">English</option>
            <option value="fr" th:selected="${#locale.language == 'fr'}" th:text="#{lang.fr}">French</option>
            <option value="de" th:selected="${#locale.language == 'de'}" th:text="#{lang.de}">German</option>
        </select>
    </form>

    <div class="reset-container">
        <h1>🔒 <span th:text="#{auth.reset.heading}">New Password</span></h1>
        <p class="subtitle" th:text="#{auth.reset.subtitle}">Reports Server</p>
        
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        
        <form th:action="@{/reset-password}" method="post" th:if="${token}">
            <input type="hidden" name="token" th:value="${token}">
            
            <div class="form-group">
                <label for="password" th:text="#{auth.reset.newPassword}">New Password</label>
                <input type="password" id="password" name="password" required minlength="6" autofocus>
                <p class="password-hint" th:text="#{auth.register.hint}">At least 6 characters</p>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword" th:text="#{auth.reset.confirmPassword}">Confirm New Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
            </div>
            
            <button type="submit" class="btn" th:text="#{auth.reset.submit}">Reset Password</button>
        </form>
        
        <div class="links">
            <a th:href="@{/login(lang=${#locale.language})}" href="/login" th:text="#{auth.reset.back}">Back to Login</a>
        </div>

    </div>
</body>
</html>
