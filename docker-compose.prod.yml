# Production Docker Compose Configuration
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-reportserver}
      - POSTGRES_USER=${POSTGRES_USER:-reportserver}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reportserver} -d ${POSTGRES_DB:-reportserver}"]
      interval: 10s
      timeout: 5s
      retries: 10

  reportserver:
    image: reportserver:${VERSION:-latest}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    environment:
      - JAVA_OPTS=-Xmx1536m -Xms768m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication
      - LOGGING_LEVEL_ROOT=WARN
      - LOGGING_LEVEL_COM_REPORTSERVER=INFO
      - SPRING_PROFILES_ACTIVE=postgresql
      - SPRING_H2_CONSOLE_ENABLED=false

      # JDBC configuration (profile application-postgresql.properties)
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-reportserver}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-reportserver}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-change-me}

      # HikariCP pool tuning
      - DB_POOL_MIN_IDLE=5
      - DB_POOL_MAX_SIZE=30
      - DB_POOL_IDLE_TIMEOUT_MS=300000
      - DB_POOL_MAX_LIFETIME_MS=1800000
      - DB_POOL_CONNECTION_TIMEOUT_MS=30000
      - DB_POOL_VALIDATION_TIMEOUT_MS=5000

      # Security-sensitive settings should be overridden in deployment env
      - DATASOURCE_ENCRYPTION_KEY=${DATASOURCE_ENCRYPTION_KEY:-change-me-in-production}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}

      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=100MB
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=100MB
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,metrics
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=when-authorized

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s

    volumes:
      - reportserver-data-prod:/app/data

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  reportserver-data-prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data-production
  postgres-data-prod:
    driver: local
