<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" data-bwignore="true" data-1p-ignore="true" data-lpignore="true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{auth.register.title}">Register - Reports Server</title>
    <script>
        (function () {
            function shouldIgnore(text, source) {
                return text.indexOf('No Listener: tabs:outgoing.message.ready') !== -1 ||
                    source.indexOf('bootstrap-autofill-overlay.js') !== -1 ||
                    text.indexOf("Cannot read properties of null (reading 'includes')") !== -1;
            }
            window.addEventListener('unhandledrejection', function (event) {
                var reason = event && event.reason;
                var text = String((reason && (reason.message || reason.stack)) || reason || '');
                if (shouldIgnore(text, text)) {
                    event.preventDefault();
                }
            }, true);
            window.addEventListener('error', function (event) {
                var text = String((event && event.message) || '');
                var source = String((event && event.filename) || '');
                if (shouldIgnore(text, source)) {
                    event.preventDefault();
                    return true;
                }
                return false;
            }, true);
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .links {
            margin-top: 20px;
            text-align: center;
        }
        .links a {
            color: #667eea;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .password-hint {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        .language-picker {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 13px;
        }
        .language-picker select {
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.18);
            color: white;
            padding: 6px 8px;
            backdrop-filter: blur(4px);
        }
        .language-picker option {
            color: #1f2937;
        }
    </style>
</head>
<body data-bwignore="true" data-1p-ignore="true" data-lpignore="true">
    <form class="language-picker" th:action="@{/register}" method="get">
        <label for="langSelectRegister" th:text="#{lang.label}">Language</label>
        <select id="langSelectRegister" name="lang" onchange="this.form.submit()">
            <option value="en" th:selected="${#locale.language == 'en'}" th:text="#{lang.en}">English</option>
            <option value="fr" th:selected="${#locale.language == 'fr'}" th:text="#{lang.fr}">French</option>
            <option value="de" th:selected="${#locale.language == 'de'}" th:text="#{lang.de}">German</option>
        </select>
    </form>

    <div class="register-container">
        <h1>📝 <span th:text="#{auth.register.heading}">Create Account</span></h1>
        <p class="subtitle" th:text="#{auth.register.subtitle}">Join Reports Server</p>
        
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        
        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label for="username" th:text="#{auth.login.username}">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="email" th:text="#{auth.register.email}">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password" th:text="#{auth.register.password}">Password</label>
                <input type="password" id="password" name="password" required minlength="6">
                <p class="password-hint" th:text="#{auth.register.hint}">At least 6 characters</p>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword" th:text="#{auth.register.confirmPassword}">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
            </div>
            
            <button type="submit" class="btn" th:text="#{auth.register.submit}">Create Account</button>
        </form>
        
        <div class="links">
            <span th:text="#{auth.register.haveAccount}">Already have an account?</span>
            <a th:href="@{/login(lang=${#locale.language})}" href="/login" th:text="#{auth.register.loginHere}">Login here</a>
        </div>

    </div>
</body>
</html>
