<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="sidebar">
    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>📊 Reports Server</h2>
        </div>
        <nav class="sidebar-nav" role="navigation" aria-label="Main navigation">
            <div class="sidebar-tree-group expanded" data-sidebar-section="workspace">
                <button type="button" class="sidebar-tree-group-toggle" onclick="toggleSidebarTreeSection('workspace')" aria-expanded="true">
                    <span class="sidebar-tree-caret">▾</span>
                    <span>Workspace</span>
                </button>
                <div class="sidebar-tree-children">
                    <button type="button" class="nav-item sidebar-tree-item active" data-tab="reports" aria-label="Reports section" title="View and generate reports">
                        <span class="nav-item-icon" aria-hidden="true">📄</span>
                        <span>Reports</span>
                    </button>
                    <button type="button" class="nav-item sidebar-tree-item" sec:authorize="hasAnyRole('ADMIN','OPERATOR')" data-tab="builder" aria-label="Report Builder section" title="Build custom reports">
                        <span class="nav-item-icon" aria-hidden="true">🔨</span>
                        <span>Report Builder</span>
                    </button>
                </div>
            </div>

            <div class="sidebar-tree-group expanded" data-sidebar-section="operations">
                <button type="button" class="sidebar-tree-group-toggle" onclick="toggleSidebarTreeSection('operations')" aria-expanded="true">
                    <span class="sidebar-tree-caret">▾</span>
                    <span>Operations</span>
                </button>
                <div class="sidebar-tree-children">
                    <button type="button" class="nav-item sidebar-tree-item" sec:authorize="hasAnyRole('ADMIN','OPERATOR')" data-tab="datasources" aria-label="Datasources section" title="Manage data connections">
                        <span class="nav-item-icon" aria-hidden="true">🗄️</span>
                        <span>Datasources</span>
                    </button>
                    <button type="button" class="nav-item sidebar-tree-item" sec:authorize="hasAnyRole('ADMIN','OPERATOR')" data-tab="schedules" aria-label="Schedules section" title="Manage scheduled reports">
                        <span class="nav-item-icon" aria-hidden="true">⏰</span>
                        <span>Schedules</span>
                    </button>
                </div>
            </div>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user-toolbar">
                <button type="button" class="sidebar-user-chip" id="sidebarUserChip" onclick="toggleSidebarUserMenu()" aria-label="Open user menu" aria-haspopup="true" aria-expanded="false">
                    <span class="sidebar-user-avatar" aria-hidden="true">👤</span>
                    <span id="sidebarCurrentUsername" class="sidebar-user-name" sec:authentication="name">User</span>
                </button>
                <button type="button" class="sidebar-settings-toggle" id="sidebarSettingsToggle" onclick="toggleSidebarUserMenu()" aria-label="Open settings menu" aria-haspopup="true" aria-expanded="false">⚙️</button>

                <div id="sidebarSettingsMenu" class="sidebar-settings-menu" role="menu" aria-label="User settings menu">
                    <button type="button" class="sidebar-settings-item" sec:authorize="hasRole('ADMIN')" onclick="closeSidebarUserMenu(); switchTab('users');" role="menuitem">👥 User Management</button>
                    <a href="/change-password" class="sidebar-settings-item" role="menuitem" onclick="closeSidebarUserMenu()">🔐 Change Password</a>
                    <button type="button" class="sidebar-settings-item danger" onclick="submitSidebarLogout()" role="menuitem">🚪 Logout</button>
                </div>

                <form id="sidebarLogoutForm" th:action="@{/logout}" method="post" style="display: none;">
                    <button type="submit">Logout</button>
                </form>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
