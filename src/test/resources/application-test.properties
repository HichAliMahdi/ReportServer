# Test profile configuration
spring.application.name=Report Server Test
reportserver.installation.enabled=false

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Keep Quartz consistent with the main configuration while preventing jobs from running in tests
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always
spring.quartz.auto-startup=false
spring.quartz.properties.org.quartz.jobStore.isClustered=false
spring.quartz.properties.org.quartz.scheduler.instanceId=NON_CLUSTERED_TEST

# Disable mail for tests
spring.mail.host=localhost
spring.mail.port=25025
spring.mail.username=test
spring.mail.password=test

# Test report storage
reports.storage.path=./target/test-reports
reports.generated.path=./target/test-generated

# JWT Configuration
reportserver.jwt.secret=test-secret-key-for-jwt-token-generation-in-unit-tests-only-not-for-production
reportserver.jwt.expiration=3600000
reportserver.app.base-url=http://localhost:8080

# Logging
logging.level.com.reportserver=DEBUG
logging.level.org.springframework.security=WARN
